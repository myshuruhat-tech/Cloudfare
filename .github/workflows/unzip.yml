name: Unzip and deploy
on:
  push:
    paths: ['*.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip into repo
        run: |
          z=$(ls *.zip | head -1)
          tmp=$(mktemp -d)
          unzip -q "$z" -d "$tmp"
          n=$(ls -A "$tmp" | wc -l)
          first=$(ls -A "$tmp" | head -1)
          if [ "$n" -eq 1 ] && [ -d "$tmp/$first" ]; then src="$tmp/$first"; else src="$tmp"; fi
          rsync -a --exclude='.git/' --exclude='.github/' "$src"/ ./
          rm -f *.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update from zip"
          git push
